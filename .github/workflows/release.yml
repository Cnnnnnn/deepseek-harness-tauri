name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm ci
      - name: Build universal app (arm64 + x86_64 → lipo → zip + dmg)
        run: bash scripts/build-universal.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: |
            DeepSeek.Harness-universal-mac.zip
            DeepSeek.Harness-universal-mac.dmg

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mac-universal/DeepSeek.Harness-universal-mac.zip
            artifacts/mac-universal/DeepSeek.Harness-universal-mac.dmg
