[package]
name = "dsh-tauri"
version = "1.0.16"
description = "DeepSeek Harness (dsh) Tauri 封装"
authors = ["shienliang"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zstd = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
